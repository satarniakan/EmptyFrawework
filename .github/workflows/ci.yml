name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Platform.slnx

      - name: Build
        run: dotnet build Platform.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Platform.slnx --no-build -c Release --verbosity normal
