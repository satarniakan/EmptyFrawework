# اجرای محلی کل سامانه با یک دستور: SQL Server + اپ.
# اجرا:  docker compose up --build
# سپس مرورگر: http://localhost:8080
# اتصال دیتابیس داخل compose از همین فایل می‌آید؛ روی سیستم خودتان همان
# appsettings.json خودتان حاکم است.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Pass123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: samples/Sample.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=PlatformDev;User Id=sa;Password=Dev_Pass123!;TrustServerCertificate=True"
      # شمارهٔ شما برای ادمین اول (همان Identity:FirstAdminPhoneNumber):
      Identity__FirstAdminPhoneNumber: ""
      Dev__AutoLoginPhone: ""
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqldata:
